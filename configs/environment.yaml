# Narrow 0.50 m doorway, 0.03 m partition, crossed from -X to +X. Physics timing/forces match Easy.
task: medium
model_path: assets/arena.xml
frame_skip: 50
max_steps: 500
object_pose: [-1.5, 0.0, 0.0]
num_agents: 4
randomize_agents: true
# Independent toggles; disabled object components retain object_pose values.
randomize_object_position: false
randomize_object_orientation: false
# XY half-widths around object_pose, in meters; yaw bounds are absolute radians.
object_position_range: [0.4, 0.6]
object_yaw_range: [-3.141592653589793, 3.141592653589793]
spawn_gap_min: 0.04
spawn_gap_max: 0.12
agent_positions: null
# Reward reference beyond the doorway; success is full-object crossing.
goal_center: [1.5, 0.0]
goal_half_size: [0.75, 0.65]
crossing_margin: 0.05
distance_weight: 0.1
distance_scale: 2.0
orientation_weight: 0.0
progress_weight: 2.0
success_reward: 20.0
failure_penalty: 20.0
max_penetration: 0.005
max_linear_speed: 5.0
max_angular_speed: 10.0
